name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 2.1.317 is Confer's minClaudeCodeVersion, the newest version any plugin here needs.
        claude-code: [2.1.317, latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global @anthropic-ai/claude-code@${{ matrix.claude-code }}
      - run: ./test.sh
        shell: bash
